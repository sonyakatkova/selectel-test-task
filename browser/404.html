<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>test-app</title>
  <script>

    const segment = () => {
      const path = window.location.pathname;
      const repoName = '/selectel-test-task'; 
      if (path.startsWith(repoName)) {
        window.location.href = repoName + '/#' + path.substring(repoName.length);
      } else {
        window.location.href = repoName + '/#' + path;
      }
    };
    
    segment();
  </script>
</head>
<body>
  <p>Перенаправление...</p>
</body>
</html>
